<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ST64 Edison Bulb - Glowing Filament Animations</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #08080a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
            outline: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Top Control Deck (Palette + Dimmer) */
        #top-controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(30, 30, 35, 0.85);
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            z-index: 10;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        #palette-container {
            display: flex;
            gap: 8px;
        }

        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            outline: none !important;
        }

        .color-btn:hover, .color-btn.active {
            transform: scale(1.15);
            border-color: #fff;
        }

        .divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
        }

        /* Dimmer Slider Styling */
        #dimmer-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #dimmer-container label {
            color: #d4af37;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        #dimmer-slider {
            -webkit-appearance: none;
            width: 90px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none !important;
            cursor: pointer;
        }

        #dimmer-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffaa44;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 170, 68, 0.8);
            transition: transform 0.1s;
        }

        #dimmer-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Instructions Modal */
        #instructions-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 25, 0.92);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 24px 30px;
            border-radius: 16px;
            color: #eee;
            z-index: 100;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            max-width: 360px;
            width: 85%;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        #instructions-modal h3 {
            margin: 0 0 12px 0;
            color: #d4af37;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        #instructions-modal ul {
            text-align: left;
            margin: 0 0 20px 0;
            padding-left: 20px;
            font-size: 13px;
            line-height: 1.6;
            color: #ccc;
        }

        #instructions-modal ul li span {
            color: #ffaa44;
            font-weight: 600;
        }

        #close-instructions {
            background: #d4af37;
            color: #111;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            outline: none !important;
        }

        #close-instructions:hover {
            background: #e5c158;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <!-- Instructions Modal -->
    <div id="instructions-modal">
        <h3>LampDroid Features</h3>
        <ul>
            <li><span>Swipe / Drag:</span> Nudge the lamp.</li>
            <li><span>Tap Bulb:</span> Toggle light on or off.</li>
            <li><span>Double Tap:</span> Zoom camera in or out.</li>
            <li><span>Dimmer & Colors:</span> Adjust brightness and hues using top controls.</li>
        </ul>
        <button id="close-instructions">Got it</button>
    </div>

    <!-- Top Control Deck -->
    <div id="top-controls">
        <div id="palette-container">
            <button class="color-btn active" style="background: #ff9933;" data-color="ff9933" title="Edison Warm"></button>
            <button class="color-btn" style="background: #ff3366;" data-color="ff3366" title="Sunset Rose"></button>
            <button class="color-btn" style="background: #9933ff;" data-color="9933ff" title="Cyberpunk Purple"></button>
            <button class="color-btn" style="background: #33ffaa;" data-color="33ffaa" title="Emerald Mint"></button>
            <button class="color-btn" style="background: #3388ff;" data-color="3388ff" title="Midnight Blue"></button>
            <button class="color-btn" style="background: #ffffff;" data-color="ffffff" title="Pure Daylight"></button>
        </div>
        
        <div class="divider"></div>

        <div id="dimmer-container">
            <label for="dimmer-slider">Dimmer</label>
            <input type="range" id="dimmer-slider" min="0" max="1" step="0.01" value="1.0">
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="three.min.js"></script>

    <script>
        // Dismiss instructions modal
        document.getElementById('close-instructions').addEventListener('click', () => {
            const modal = document.getElementById('instructions-modal');
            modal.style.transition = 'opacity 0.3s ease';
            modal.style.opacity = '0';
            setTimeout(() => modal.remove(), 300);
        });

        // --- SCENE, CAMERA, & RENDERER SETUP ---
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x08080a, 0.02);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.8, 6.5);
        camera.lookAt(0, 0.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.6;
        container.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x1a1a22, 1.8);
        scene.add(ambientLight);

        const bulbLight = new THREE.PointLight(0xff9933, 8.5, 14, 1.8);
        bulbLight.castShadow = true;
        bulbLight.shadow.bias = -0.002;
        scene.add(bulbLight);

        const fillLight = new THREE.DirectionalLight(0x223344, 0.4);
        fillLight.position.set(4, 4, -2);
        scene.add(fillLight);

        // --- ENVIRONMENT & MASSIVELY EXTENDED BACK WALL ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x08080a, roughness: 0.9 });
        const wall = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), wallMat);
        wall.position.set(0, 15, -3.5);
        scene.add(wall);

        const deskMat = new THREE.MeshStandardMaterial({ 
            color: 0x16181c, 
            roughness: 0.2, 
            metalness: 0.85 
        });
        const desk = new THREE.Mesh(new THREE.BoxGeometry(8, 0.2, 5), deskMat);
        desk.position.set(0, -1.2, 0);
        desk.receiveShadow = true;
        scene.add(desk);

        // --- ANDROID HEAD EMBLEM IN BLACK ---
        const androidCanvas = document.createElement('canvas');
        androidCanvas.width = 512;
        androidCanvas.height = 512;
        const ctx = androidCanvas.getContext('2d');
        
        ctx.fillStyle = "rgba(0,0,0,0)";
        ctx.fillRect(0, 0, 512, 512);
        
        const androidBlack = "#0d0d0d";

        ctx.strokeStyle = androidBlack;
        ctx.lineWidth = 14;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(200, 140); ctx.lineTo(165, 80);
        ctx.moveTo(312, 140); ctx.lineTo(347, 80);
        ctx.stroke();
        
        ctx.fillStyle = androidBlack;
        ctx.beginPath();
        ctx.arc(256, 210, 110, Math.PI, 0, false);
        ctx.fill();
        
        ctx.fillStyle = "#16181c";
        ctx.beginPath();
        ctx.arc(215, 195, 12, 0, Math.PI * 2);
        ctx.arc(297, 195, 12, 0, Math.PI * 2);
        ctx.fill();

        const androidTexture = new THREE.CanvasTexture(androidCanvas);
        const emblemMat = new THREE.MeshStandardMaterial({ 
            map: androidTexture, 
            transparent: true,
            roughness: 0.3,
            metalness: 0.4
        });
        const emblemMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.8), emblemMat);
        emblemMesh.rotation.x = -Math.PI / 2;
        emblemMesh.position.set(0, -1.09, 0.2);
        emblemMesh.receiveShadow = false; // Fixed: prevents dark shadows from casting over the emblem
        scene.add(emblemMesh);

        // --- LAMP CONSTRUCTION ---
        const pivotGroup = new THREE.Group();
        pivotGroup.position.set(0, 3.2, 0);
        scene.add(pivotGroup);

        const lampGroup = new THREE.Group();
        pivotGroup.add(lampGroup);

        // 1. Cord
        const cordGeo = new THREE.CylinderGeometry(0.025, 0.025, 2.2, 8);
        const cordMat = new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: 0.9 });
        const cord = new THREE.Mesh(cordGeo, cordMat);
        cord.position.set(0, -1.1, 0);
        lampGroup.add(cord);

        // 2. Silver Screw Base
        const baseGroup = new THREE.Group();
        baseGroup.position.set(0, -2.3, 0);
        lampGroup.add(baseGroup);

        const silverMat = new THREE.MeshStandardMaterial({ color: 0xd0d0d0, metalness: 0.95, roughness: 0.25 });
        const threadedBody = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.13, 0.35, 24), silverMat);
        baseGroup.add(threadedBody);

        const eyeletMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
        const eyelet = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.05, 16), eyeletMat);
        eyelet.position.y = 0.18;
        baseGroup.add(eyelet);

        // 3. Glass Bulb & Glowing Animated Filaments
        const bulbGroup = new THREE.Group();
        bulbGroup.position.set(0, -2.7, 0);
        lampGroup.add(bulbGroup);

        const glassGeo = new THREE.SphereGeometry(0.42, 32, 32);
        glassGeo.scale(1, 1.4, 1);
        
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xff9933,
            emissive: 0xff9933,
            emissiveIntensity: 0.6,
            metalness: 0.0,
            roughness: 0.05,
            transmission: 0.92,
            thickness: 0.3,
            transparent: true,
            opacity: 0.95,
            reflectivity: 0.9,
            side: THREE.DoubleSide
        });
        const glassBulb = new THREE.Mesh(glassGeo, glassMat);
        glassBulb.castShadow = false; // Fixed: transparent glass shouldn't cast an opaque block shadow below
        bulbGroup.add(glassBulb);

        // Glowing orange filament material supporting animation
        const filamentMat = new THREE.MeshStandardMaterial({ 
            color: 0xffaa44, 
            emissive: 0xff5500, 
            emissiveIntensity: 2.5,
            roughness: 0.2 
        });
        const filamentGroup = new THREE.Group();
        
        for (let i = 0; i < 4; i++) {
            const stripGeo = new THREE.BoxGeometry(0.015, 0.35, 0.005);
            const strip = new THREE.Mesh(stripGeo, filamentMat);
            const angle = (i / 4) * Math.PI * 2;
            strip.position.set(Math.cos(angle) * 0.08, -0.05, Math.sin(angle) * 0.08);
            filamentGroup.add(strip);
        }
        bulbGroup.add(filamentGroup);

        // --- PENDULUM & SWIPE INTERACTION PHYSICS ---
        let angleX = 0;
        let angleZ = 0.08;
        let velX = 0;
        let velZ = 0;
        
        const gravity = 9.81;
        const length = 2.2;
        const damping = 0.985;

        let pointerDown = false;
        let startX = 0, startY = 0, startTime = 0;
        let lastX = 0, lastY = 0;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactiveObjects = [glassBulb, threadedBody];
        let lastTapTime = 0;
        let isZoomedOut = true;
        let dimmerIntensity = 1.0;
        let currentHexColor = 0xff9933;

        function triggerZoom() {
            isZoomedOut = !isZoomedOut;
            let targetZ = isZoomedOut ? 6.5 : 4.2;
            let targetY = isZoomedOut ? 1.8 : 1.2;

            let zoomStart = performance.now();
            let startZ = camera.position.z;
            let startCamY = camera.position.y;

            function animateZoom(now) {
                let progress = Math.min((now - zoomStart) / 400, 1);
                let ease = progress * (2 - progress);
                camera.position.z = startZ + (targetZ - startZ) * ease;
                camera.position.y = startCamY + (targetY - startCamY) * ease;
                camera.lookAt(0, 0.5, 0);

                if (progress < 1) {
                    requestAnimationFrame(animateZoom);
                }
            }
            requestAnimationFrame(animateZoom);
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#top-controls') || e.target.closest('#instructions-modal')) return;

            pointerDown = true;
            startX = e.clientX;
            startY = e.clientY;
            lastX = e.clientX;
            lastY = e.clientY;
            startTime = performance.now();

            const tapLength = startTime - lastTapTime;
            if (tapLength < 350 && tapLength > 0) {
                e.preventDefault();
                triggerZoom();
                lastTapTime = 0;
                pointerDown = false;
                return;
            }
            lastTapTime = startTime;
        });

        window.addEventListener('pointermove', (e) => {
            if (!pointerDown) return;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            if (!pointerDown) return;
            pointerDown = false;

            const endX = e.clientX;
            const endY = e.clientY;
            const endTime = performance.now();
            const duration = Math.max(endTime - startTime, 10);

            const deltaX = endX - startX;
            const deltaY = endY - startY;
            const dist = Math.hypot(deltaX, deltaY);

            if (dist < 12 && duration < 300) {
                mouse.x = (endX / window.innerWidth) * 2 - 1;
                mouse.y = -(endY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveObjects);

                if (intersects.length > 0) {
                    const slider = document.getElementById('dimmer-slider');
                    if (parseFloat(slider.value) > 0) {
                        slider.value = 0;
                    } else {
                        slider.value = 1.0;
                    }
                    slider.dispatchEvent(new Event('input'));
                    return;
                }
            }

            const throwPower = 0.0035;
            velZ += (deltaX / duration) * throwPower * 15;
            velX += (-deltaY / duration) * throwPower * 15;
        });

        // --- DIMMER SLIDER LISTENER ---
        const dimmerSlider = document.getElementById('dimmer-slider');
        dimmerSlider.addEventListener('input', (e) => {
            dimmerIntensity = parseFloat(e.target.value);
            bulbLight.intensity = dimmerIntensity * 9.0;
            glassMat.emissiveIntensity = dimmerIntensity * 0.7;
            
            if (dimmerIntensity === 0) {
                filamentMat.emissiveIntensity = 0;
                glassMat.emissive.setHex(0x000000);
            } else {
                filamentMat.emissiveIntensity = dimmerIntensity * 2.5;
                glassMat.emissive.setHex(currentHexColor);
            }
        });

        // --- MOOD COLOR PALETTE ---
        const colorButtons = document.querySelectorAll('.color-btn');
        colorButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                colorButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const hexStr = btn.getAttribute('data-color');
                currentHexColor = parseInt(hexStr, 16);

                bulbLight.color.setHex(currentHexColor);
                glassMat.color.setHex(currentHexColor);
                if (dimmerIntensity > 0) {
                    glassMat.emissive.setHex(currentHexColor);
                }
            });
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsedTime = clock.getElapsedTime();

            const subSteps = 8;
            const subDelta = delta / subSteps;

            for (let i = 0; i < subSteps; i++) {
                let accelX = (-gravity / length) * Math.sin(angleX);
                let accelZ = (-gravity / length) * Math.sin(angleZ);

                velX += accelX * subDelta;
                velZ += accelZ * subDelta;

                velX *= Math.pow(damping, subDelta * 60);
                velZ *= Math.pow(damping, subDelta * 60);

                angleX += velX * subDelta;
                angleZ += velZ * subDelta;
            }

            pivotGroup.rotation.z = -angleZ;
            pivotGroup.rotation.x = angleX;

            const bulbWorldPos = new THREE.Vector3();
            glassBulb.getWorldPosition(bulbWorldPos);
            bulbLight.position.copy(bulbWorldPos);

            if (dimmerIntensity > 0) {
                // Main light flicker
                bulbLight.intensity = (dimmerIntensity * 9.0) + Math.sin(elapsedTime * 50) * (0.25 * dimmerIntensity);
                
                // Pulsing glowing orange animation inside coils
                filamentMat.emissiveIntensity = (dimmerIntensity * 2.5) + Math.sin(elapsedTime * 18) * (0.6 * dimmerIntensity);
            }

            renderer.render(scene, camera);
        }

        animate();

        // --- RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
